#cloud-config
# Cloud-init configuration for tpl-rds-base-u2404-s clones
# Used by Terraform to customize base instances (servers, gateways)
#
# Usage: Pass this (or a variant) as user_data to Proxmox VM creation
# Example (Terraform):
#   cloudinit_config = templatefile("${path.module}/cloud-init/base-user-data.yaml", {
#     hostname = "rds-gateway-01"
#     ssh_keys = var.ssh_public_keys
#   })

# Hostname and FQDN (should be overridden per-instance)
hostname: rds-base-vm
fqdn: rds-base-vm.local

# Timezone
timezone: UTC

# User accounts (ubuntu user is built-in; add admin if needed)
users:
  - name: ubuntu
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true
    ssh-authorized-keys:
      # Insert public SSH key(s) here or pass from Terraform variable
      # - ssh-rsa AAAA...
      # Example: ${ssh_public_key}

# Packages to install on first boot
packages:
  - curl
  - vim
  - net-tools
  - htop
  - git
  - software-properties-common

# Run arbitrary commands after other config
runcmd:
  # Update package manager and upgrade system packages
  - apt-get update
  - apt-get upgrade -y
  
  # Verify QEMU Guest Agent is running
  - systemctl enable qemu-guest-agent
  - systemctl start qemu-guest-agent
  
  # Log completion
  - echo "Cloud-init base configuration completed at $(date)" >> /var/log/cloud-init-output.log

# Write files (optional; example for /etc/hosts configuration)
write_files:
  - path: /etc/cloud/cloud.cfg.d/99-custom.cfg
    owner: root:root
    permissions: '0644'
    content: |
      # Custom cloud-init config
      # Disable password login (enforced in template; redundant but safe)
      ssh_pwauth: false
      # Disable root login
      disable_root: true

# Disable password authentication (redundant since template has it, but explicit)
ssh_pwauth: false

# Final message
final_message: "Cloud-init for tpl-rds-base-u2404-s completed in $UPTIME seconds"
